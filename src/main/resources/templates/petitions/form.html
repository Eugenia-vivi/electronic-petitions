<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Нова петиція</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="container">
        <h1>📋 Петиції</h1>
        <a th:href="@{/petitions}">← Назад до списку</a>
    </div>
</header>

<main>
    <div class="container">

        <div class="page-title">Нова петиція</div>

        <div class="form-card">
            <form th:action="@{/petitions}" th:object="${petition}" method="post">

                <div class="form-group">
                    <label>Заголовок</label>
                    <input type="text" th:field="*{title}" placeholder="Коротко опишіть суть петиції">
                </div>

                <div class="form-group">
                    <label>Опис</label>
                    <textarea th:field="*{description}" placeholder="Детально опишіть проблему та бажаний результат"></textarea>
                </div>

                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" th:field="*{author}" placeholder="Ім'я автора">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success">✅ Створити петицію</button>
                    <a th:href="@{/petitions}" class="btn btn-secondary">Скасувати</a>
                </div>

            </form>
        </div>

    </div>
</main>

<footer>
    <p>Система петицій © 2026</p>
</footer>

</body>
</html>
