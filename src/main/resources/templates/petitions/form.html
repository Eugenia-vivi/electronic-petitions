<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Подати петицію — Електронні петиції</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div style="margin-bottom: 1.5rem;">
        <a class="btn" th:href="@{/petitions}">← Скасувати</a>
    </div>

    <div class="card">
        <span class="brand-badge">Нова публікація</span>
        <h1 style="margin-bottom: 1.5rem;">Подати власну петицію</h1>

        <form th:action="@{/petitions}" th:object="${petition}" method="post">
            <div class="form-group">
                <label for="title">Тема петиції:</label>
                <input type="text" id="title" th:field="*{title}" placeholder="Короткий заголовок..." required>
            </div>

            <div class="form-group">
                <label for="description">Суть звернення та аргументація:</label>
                <textarea id="description" th:field="*{description}" rows="7" placeholder="Опишіть проблему та запропонуйте конкретні рішення..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Опублікувати петицію 🚀</button>
        </form>
        
        <footer class="site-footer">
            <div>© 2026 <strong>vinedyss</strong></div>
            <div>⚡ Платформа електронних петицій</div>
        </footer>
    </div>
</div>
</body>
</html>
