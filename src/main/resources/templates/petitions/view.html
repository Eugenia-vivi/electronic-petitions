<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'⚡ ' + ${petition.title} + ' — Електронні петиції'">⚡ Електронні петиції</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div style="margin-bottom: 1.5rem;">
        <a class="btn" th:href="@{/petitions}">← До всіх петицій</a>
    </div>

    <div class="card">
        <span class="brand-badge" style="background: var(--accent-purple);">Офіційна ініціатива</span>
        <h1 style="margin: 0.5rem 0 1rem 0;" th:text="${petition.title}">Заголовок петиції</h1>

        <div class="vote-counter-box" style="background: #fffdf0;">
            <span class="vote-number" th:text="${petition.votes != null ? petition.votes.size() : 0}">0</span>
            <div>
                <h3>Громадян підтримали ініціативу</h3>
                <p style="font-size: 0.9rem;">Приєднуйтесь до збору підписів просто зараз</p>
            </div>
        </div>

        <div class="petition-body" th:text="${petition.description}">
            Повний текст петиції та аргументація вимог...
        </div>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: var(--border-thick); display: flex; gap: 1rem;">
            <a class="btn btn-primary" th:href="@{/petitions/{id}/vote(id=${petition.id})}">Підписати цю петицію ✍️</a>

        <footer class="site-footer">
            <div>© 2026 <strong>vinedyss</strong></div>
            <div>⚡ Платформа електронних петицій</div>
        </footer>
        </div>
    </div>
</div>
</body>
</html>
