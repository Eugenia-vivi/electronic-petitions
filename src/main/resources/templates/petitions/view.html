<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${petition.title}">Петиція</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <div class="container">
        <h1>📋 Петиції</h1>
        <a th:href="@{/petitions}">← Назад до списку</a>
    </div>
</header>

<main>
    <div class="container">

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="petition-detail">

            <h2 th:text="${petition.title}"></h2>

            <div class="petition-meta">
                <span>✍️ Автор: <strong th:text="${petition.author}"></strong></span>
                <span>📅 <span th:text="${petition.createdAt}"></span></span>
            </div>

            <p class="description" th:text="${petition.description}"></p>

            <div class="vote-count-block">
                <span class="number" th:text="${petition.voteCount}"></span>
                <div class="label">голосів<br>зібрано</div>
            </div>

            <div class="petition-actions">
                <a th:href="${voteUrl}" class="btn btn-primary">👍 Проголосувати</a>

                <form th:action="@{/petitions/{id}/delete(id=${petition.id})}" method="post"
                      style="display:inline;">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Видалити цю петицію?')">
                        🗑 Видалити
                    </button>
                </form>
            </div>

        </div>
    </div>
</main>

<footer>
    <p>Система петицій © 2026</p>
</footer>

</body>
</html>
