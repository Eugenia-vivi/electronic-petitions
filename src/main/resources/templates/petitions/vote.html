<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Підписати петицію — Електронні петиції</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="alternate icon" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 600px;">
    <div style="margin-bottom: 1.5rem;">
        <a class="btn" th:href="@{/petitions/{id}(id=${petitionId})}">← Повернутися</a>
    </div>

    <div class="card">
        <span class="brand-badge" style="background: var(--accent-cyan);">Голосування</span>
        <h2 style="margin-bottom: 1.5rem;">Залишити свій голос</h2>

        <form th:action="@{/petitions/{id}/vote(id=${petitionId})}" th:object="${vote}" method="post">
            <div class="form-group">
                <label for="userName">Ваше повне ім'я:</label>
                <input type="text" id="userName" th:field="*{userName}" placeholder="Тарас Шевченко" required>
            </div>

            <div class="form-group">
                <label for="email">Контактний Email:</label>
                <input type="email" id="email" th:field="*{email}" placeholder="example@domain.com" required>
            </div>

            <button type="submit" class="btn btn-accent" style="width: 100%;">Підтвердити підпис ✍️</button>
                    
        <footer class="site-footer">
            <div>© 2026 <strong>vinedyss</strong></div>
            <div>⚡ Платформа електронних петицій</div>
        </footer>
        </form>
    </div>
</div>
</body>
</html>
